[project]
name = "edd-demo-harness"
version = "1.0.0"
description = "EDD demo harness: one EvalHub job, one verdict, one MLflow record gating a release"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=2.20",
    "requests>=2.31",
]

[project.optional-dependencies]
# the web console (app.py); install with: pip install -e ".[ui]"
ui = ["streamlit>=1.50"]

[tool.setuptools]
packages = ["agent", "harness"]
py-modules = ["app"]
